name: Tests and desktop build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build the Windows installer and portable application
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  python:
    name: Python bridge and Windows profile storage
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install host dependencies
        run: python -m pip install -r host/requirements.txt
      - name: Run all Python tests
        run: python -B -m unittest discover -s host -p "test_*.py" -v

  radio-core:
    name: Portable C encoder and parser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build native tests with strict warnings
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wextra -Werror app/radio_core.c tests/test_radio_core.c -o build/test_radio_core
      - name: Run native tests
        run: ./build/test_radio_core

  desktop:
    name: Build Windows desktop application
    if: github.event_name == 'workflow_dispatch' && inputs.build_installer
    needs: [python, radio-core]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install pinned packaging dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare verified portable Inno Setup compiler
        shell: pwsh
        run: ./packaging/fetch_inno.ps1 -Destination ./build/tooling
      - name: Build and audit application and installer
        run: python -B packaging/build_windows.py --work-dir build/desktop --output-dir dist --inno-compiler build/tooling/inno/ISCC.exe
      - name: Save downloadable Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: PiShockBridge-windows-x64
          path: |
            dist/PiShockBridge-Setup-*.exe
            dist/PiShockBridge-*-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.json
          if-no-files-found: error
          retention-days: 14
